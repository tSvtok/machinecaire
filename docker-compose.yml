services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: machinecare-api

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/machinecare
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}

    depends_on:
      - mongo

    command: npm run dev


  mongo:
    image: mongo:8

    container_name: machinecare-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  mongo_data: